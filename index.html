<style id="vibrant-refresh">
:root{
  --stone:#f4f5fb;
  --paper:#ffffff;
  --ink:#171625;
  --soft:#6f6c80;
  --line:#e5e3ee;
  --red:#ff4d57;
  --red-dark:#c6293b;
  --red-fill:#d73547;
  --steel:#10ad9d;
  --steel-dark:#078176;
  --steel-fill:#087f76;
  --danger-bg:#ffe5e8;
  --red-wash:#fff0ed;
  --steel-wash:#e8faf7;
  --menu-shadow:rgba(35,31,62,.16);
  --violet:#775cff;
  --amber:#ffb632;
  --surface-soft:#f8f8fc;
  --shadow:0 18px 50px rgba(45,38,86,.10);
  --shadow-soft:0 8px 24px rgba(45,38,86,.08);
}
html[data-theme="dark"]{
  --stone:#0e0f17;
  --paper:#181a25;
  --ink:#f7f6fc;
  --soft:#a8a5b8;
  --line:#2d2f3d;
  --red:#ff5c66;
  --red-dark:#ff9ba1;
  --red-fill:#d93c4d;
  --steel:#25d1be;
  --steel-dark:#77eadc;
  --steel-fill:#087f76;
  --danger-bg:#41242d;
  --red-wash:#352128;
  --steel-wash:#17322f;
  --menu-shadow:rgba(0,0,0,.48);
  --violet:#917cff;
  --amber:#ffc85b;
  --surface-soft:#12141d;
  --shadow:0 18px 50px rgba(0,0,0,.25);
  --shadow-soft:0 8px 24px rgba(0,0,0,.20);
}

html{background:var(--stone);scroll-behavior:smooth}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% -5%,color-mix(in srgb,var(--red) 15%,transparent) 0,transparent 32rem),
    radial-gradient(circle at 95% 30%,color-mix(in srgb,var(--violet) 12%,transparent) 0,transparent 28rem),
    var(--stone);
  font-family:Inter,ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--violet) 32%,transparent);outline-offset:2px}
.app{position:relative;max-width:640px;min-height:100vh;padding-bottom:118px;isolation:isolate}
.app::before,.app::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(2px);pointer-events:none}
.app::before{width:170px;height:170px;top:130px;left:max(calc(50% - 390px),-80px);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.app::after{width:210px;height:210px;right:max(calc(50% - 405px),-110px);bottom:120px;background:color-mix(in srgb,var(--steel) 9%,transparent)}

.header{
  padding:17px 20px;
  background:color-mix(in srgb,var(--stone) 82%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--line) 78%,transparent);
  backdrop-filter:blur(18px) saturate(145%);
  -webkit-backdrop-filter:blur(18px) saturate(145%);
}
.brand-lockup{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  display:grid;place-items:center;width:38px;height:38px;flex:0 0 auto;
  color:#fff;border-radius:12px;
  background:linear-gradient(135deg,var(--red),#ff784f 58%,var(--amber));
  box-shadow:0 8px 18px color-mix(in srgb,var(--red) 30%,transparent);
  transform:rotate(-3deg);
}
.brand-mark svg{width:22px;height:22px}
.brand{font-family:"Arial Black",Impact,sans-serif;font-size:20px;line-height:.95;letter-spacing:-.7px}
.brand em{color:var(--red);font-style:normal}
.brand-sub{margin-top:4px;color:var(--soft);font-size:8px;font-weight:900;letter-spacing:.19em;text-transform:uppercase}
.header-actions{gap:8px}
.theme-select,.unit-btn{
  min-height:36px;border-color:color-mix(in srgb,var(--line) 88%,transparent);
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  box-shadow:0 3px 12px rgba(45,38,86,.04);
}
.theme-select{max-width:118px;padding:8px 29px 8px 12px;color:var(--ink);font-size:11px}
.theme-select:focus{border-color:var(--violet)}
.unit-btn{min-width:47px;padding:8px 11px;color:var(--red);font-weight:900;letter-spacing:.06em}
.unit-btn:hover{border-color:var(--red);background:var(--red-wash)}

.main{padding:24px 20px 10px}
.screen-heading{margin:2px 2px 22px}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;color:var(--soft);font-size:10px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}
.eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px color-mix(in srgb,var(--red) 13%,transparent)}
.eyebrow-dot.steel{background:var(--steel);box-shadow:0 0 0 5px color-mix(in srgb,var(--steel) 13%,transparent)}
.screen-title{max-width:480px;margin:0;color:var(--ink);font-family:"Arial Black",Impact,sans-serif;font-size:clamp(32px,8vw,44px);line-height:.98;letter-spacing:-1.8px}
.screen-title em{font-style:normal;color:var(--red)}
.screen-title em.steel{color:var(--steel)}
.screen-sub{margin:10px 0 0;color:var(--soft);font-size:13px;font-weight:600}

.seg{gap:5px;padding:5px;border-color:color-mix(in srgb,var(--line) 82%,transparent);background:color-mix(in srgb,var(--paper) 78%,transparent);border-radius:16px;box-shadow:var(--shadow-soft);backdrop-filter:blur(10px)}
.seg button{min-height:41px;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800;letter-spacing:-.1px}
.seg button:hover{color:var(--ink);background:var(--surface-soft)}
.seg button.active.red{background:linear-gradient(135deg,var(--red-fill),#e95542);box-shadow:0 8px 18px color-mix(in srgb,var(--red) 25%,transparent)}
.seg button.active.steel{background:linear-gradient(135deg,var(--steel-fill),#109b8e);box-shadow:0 8px 18px color-mix(in srgb,var(--steel) 24%,transparent)}
.panel{margin-top:17px}
.card,.row,.edit-row,.empty{
  border-color:color-mix(in srgb,var(--line) 86%,transparent);
  background:color-mix(in srgb,var(--paper) 94%,transparent);
  box-shadow:var(--shadow-soft);
}
.card{position:relative;overflow:visible;border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;top:0;left:25px;right:25px;height:2px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,transparent,var(--red),var(--amber),transparent);opacity:.75}
.card.steel-card::before{background:linear-gradient(90deg,transparent,var(--steel),var(--violet),transparent)}
.stack>*+*{margin-top:14px}
.fields{gap:12px}
.field label{margin-bottom:7px;color:var(--soft);font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.input,.select{
  min-height:47px;border:1px solid var(--line);border-radius:13px;padding:12px 14px;
  background:var(--surface-soft);color:var(--ink);font-size:14px;
  transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease,transform .2s ease;
}
.input::placeholder{color:color-mix(in srgb,var(--soft) 72%,transparent)}
.input:hover,.select:hover{border-color:color-mix(in srgb,var(--violet) 34%,var(--line))}
.input:focus,.select:focus{border-color:var(--violet);background:var(--paper);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 10%,transparent)}
.btn{position:relative;overflow:hidden;min-height:48px;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:900;letter-spacing:.01em;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.22) 48%,transparent 72%);transform:translateX(-120%)}
.btn.red{background:linear-gradient(135deg,var(--red-fill),#e95542);box-shadow:0 10px 24px color-mix(in srgb,var(--red) 28%,transparent)}
.btn.steel{background:linear-gradient(135deg,var(--steel-fill),#109b8e);box-shadow:0 10px 24px color-mix(in srgb,var(--steel) 25%,transparent)}
.btn.outline{border-color:var(--line);background:var(--surface-soft)}
.btn:hover{transform:translateY(-1px);filter:saturate(1.08)}
.btn:hover::after{animation:button-shine .75s ease}
.btn:active{transform:translateY(1px);box-shadow:none}
.callout{border:1px solid transparent;border-radius:13px;padding:11px 13px;font-size:12px;font-weight:600}
.callout.red{border-color:color-mix(in srgb,var(--red) 14%,transparent);background:linear-gradient(135deg,var(--red-wash),color-mix(in srgb,var(--amber) 7%,var(--red-wash)))}
.callout.steel{border-color:color-mix(in srgb,var(--steel) 14%,transparent);background:linear-gradient(135deg,var(--steel-wash),color-mix(in srgb,var(--violet) 5%,var(--steel-wash)))}
.mono{font-family:"SFMono-Regular",Consolas,monospace;letter-spacing:-.035em}
.error{padding:9px 11px;border-radius:10px;background:var(--danger-bg);font-weight:700}
.section-title{display:flex;align-items:center;gap:9px;margin:23px 3px 10px;color:var(--soft);font-size:10px;letter-spacing:.15em}
.section-title::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}

.rows>*+*{margin-top:10px}
.row{position:relative;border-radius:17px;padding:14px 15px;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.row::before{content:"";width:4px;align-self:stretch;flex:0 0 auto;border-radius:999px;background:linear-gradient(var(--red),var(--amber))}
.row.steel-row::before{background:linear-gradient(var(--steel),var(--violet))}
.row.steel-row .row-kicker{color:var(--steel-dark)}
.row:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--red) 20%,var(--line));box-shadow:var(--shadow)}
.row-kicker{margin-bottom:4px;color:var(--red);font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.row-title{font-size:15px;font-weight:800}
.row-sub{margin-top:5px;font-size:11px}
.row-actions{gap:3px}
.icon-btn{display:grid;place-items:center;min-width:34px;min-height:34px;border-radius:10px;background:var(--surface-soft);font-size:15px}
.icon-btn:hover{background:var(--red-wash);color:var(--red)}
.edit-row{border-color:color-mix(in srgb,var(--red) 55%,var(--line));border-radius:18px;padding:15px;box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 7%,transparent)}
.danger{border-radius:10px;padding:8px 10px}
.text-btn{font-weight:700}
.text-btn:hover{color:var(--red)}
.suggestions{top:calc(100% + 7px);border-radius:14px;box-shadow:0 18px 45px var(--menu-shadow);overflow:hidden}
.suggestions button{padding:12px 14px;font-size:13px}
.suggestions button:hover{background:var(--red-wash);color:var(--red)}

.stats{gap:10px}
.stat{position:relative;overflow:hidden;min-height:92px;display:flex;flex-direction:column;justify-content:center;border-radius:19px;padding:13px 8px;box-shadow:var(--shadow-soft)}
.stat::after{content:"";position:absolute;width:58px;height:58px;right:-27px;bottom:-31px;border-radius:50%;background:color-mix(in srgb,var(--violet) 11%,transparent)}
.stat:nth-child(2)::after{background:color-mix(in srgb,var(--steel) 12%,transparent)}
.stat:nth-child(3)::after{background:color-mix(in srgb,var(--amber) 16%,transparent)}
.stat.red{background:linear-gradient(145deg,var(--red-fill),#e95542);box-shadow:0 12px 26px color-mix(in srgb,var(--red) 25%,transparent)}
.stat.steel{background:linear-gradient(145deg,var(--steel-fill),#109b8e);box-shadow:0 12px 26px color-mix(in srgb,var(--steel) 23%,transparent)}
.stat-label{font-size:9px;letter-spacing:.11em}
.stat-value{margin-top:5px;font-family:"Arial Black",Impact,sans-serif;font-size:24px;letter-spacing:-.8px}
.stat-unit{font-family:inherit;font-size:9px;letter-spacing:0}
.select{padding-right:46px;font-weight:800}
.mini-seg{margin-bottom:16px}
.mini-seg-inner{padding:4px;border-radius:13px;background:var(--surface-soft)}
.mini-seg button{border-radius:10px;padding:7px 15px;font-weight:800}
.mini-seg button.active{background:linear-gradient(135deg,var(--red-fill),#e95542);box-shadow:0 5px 12px color-mix(in srgb,var(--red) 22%,transparent)}
.chart{height:244px;margin:0 -2px}
.chart-grid{stroke:color-mix(in srgb,var(--line) 82%,transparent);stroke-dasharray:4 5}
.chart-label{fill:var(--soft);font-size:9px;font-weight:700}
.empty{border-style:solid;border-radius:24px;padding:46px 24px;background:linear-gradient(145deg,color-mix(in srgb,var(--paper) 96%,transparent),color-mix(in srgb,var(--violet) 5%,var(--paper)))}
.empty-icon{display:grid;place-items:center;width:58px;height:58px;margin:0 auto;border-radius:19px;color:#fff;font-size:26px;background:linear-gradient(135deg,var(--violet),var(--red));box-shadow:0 12px 28px color-mix(in srgb,var(--violet) 24%,transparent);transform:rotate(-3deg)}
.empty-title{margin-top:17px;font-size:17px;font-weight:900}
.empty-sub{max-width:290px;margin:7px auto 0;font-size:13px;line-height:1.55}

.nav{bottom:11px;border:0;background:transparent;padding:0 max(14px,env(safe-area-inset-right)) max(0px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));pointer-events:none}
.nav-inner{max-width:410px;gap:6px;padding:6px;border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:22px;background:color-mix(in srgb,var(--paper) 88%,transparent);box-shadow:0 18px 45px rgba(29,24,57,.18);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);pointer-events:auto}
.nav button{min-height:55px;border-radius:16px;padding:7px 10px;color:var(--soft);font-size:10px;letter-spacing:.03em;transition:color .2s ease,background .2s ease,transform .2s ease}
.nav button:hover{color:var(--ink);background:var(--surface-soft)}
.nav button.active{color:#fff;background:linear-gradient(135deg,var(--red-fill),#e95542);box-shadow:0 8px 20px color-mix(in srgb,var(--red) 26%,transparent);transform:translateY(-1px)}
.nav-icon{display:grid;place-items:center;width:22px;height:22px;margin:0 auto 2px}
.nav-icon svg{width:21px;height:21px;stroke:currentColor}
.toast{bottom:91px;border:1px solid color-mix(in srgb,var(--paper) 13%,transparent);padding:10px 15px;background:color-mix(in srgb,var(--ink) 94%,transparent);border-radius:12px;color:var(--paper);font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.24)}

@keyframes rise-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes button-shine{to{transform:translateX(120%)}}
@keyframes pulse-dot{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--red) 5%,transparent)}}
@media(prefers-reduced-motion:no-preference){
  .screen-heading,.seg,.panel{animation:rise-in .42s both}
  .seg{animation-delay:.04s}.panel{animation-delay:.08s}
  .eyebrow-dot{animation:pulse-dot 2.3s ease-in-out infinite}
}
@media(max-width:430px){
  .header{padding:14px 15px}.main{padding:21px 15px 8px}.brand-mark{width:35px;height:35px}.brand{font-size:18px}.brand-sub{font-size:7px}
  .theme-select{max-width:105px;padding-left:10px}.screen-heading{margin-left:1px}.card{padding:17px;border-radius:21px}.stats{gap:7px}.stat{min-height:85px}.stat-value{font-size:21px}
}
@media(max-width:370px){
  .header{gap:6px}.brand-lockup{gap:7px}.brand-mark{width:32px;height:32px}.brand-mark svg{width:19px}.brand{font-size:16px}.brand-sub{display:none}.header-actions{gap:5px}.theme-select{max-width:88px;font-size:10px}.unit-btn{min-width:42px;padding-left:8px;padding-right:8px}
  .screen-title{font-size:30px}.fields{grid-template-columns:1fr}.span2{grid-column:auto}.stat-value{font-size:18px}.stat-label{font-size:8px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand-lockup"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg></div><div><div class="brand">IRON <em>LOG</em></div><div class="brand-sub">Train · Track · Triumph</div></div></div><div class="header-actions"><label class="theme-control"><span class="sr-only">Color theme</span><select id="themeSelect" class="theme-select" aria-label="Color theme"><option value="auto">Automatic</option><option value="light">Light</option><option value="dark">Dark</option></select><span class="theme-control-arrow" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><path d="M5.5 7.5 10 12l4.5-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></label><button id="unitBtn" class="unit-btn">KG</button></div></header>
<main id="main" class="main"></main>
</div>
<nav class="nav" aria-label="Primary navigation"><div class="nav-inner"><button data-tab="log" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke-width="2.2" stroke-linecap="round"/></svg></span>Log workout</button><button data-tab="progress"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M5 18l5-5 3 3 6-8M15 8h4v4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Progress</button></div></nav>
<div id="toast" class="toast hidden"></div>
<script>
(function(){
'use strict';
const KEY_WORKOUT='workout-data', KEY_BODYWEIGHT='bodyweight-logs', KEY_SETTINGS='app-settings', KG_TO_LB=2.20462;
const state={exercises:[],logs:[],bwLogs:[],unit:'kg',theme:'auto',tab:'log',mode:'exercise',progressMode:'exercise',view:'graph',metric:'weight',selected:'',editing:null,confirming:null,confirmExercise:false};
const $=s=>document.querySelector(s); const main=$('#main');const themeQuery=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const dark=state.theme==='dark'||(state.theme==='auto'&&themeQuery.matches);document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.style.colorScheme=dark?'dark':'light';$('#themeColor').setAttribute('content',dark?'#0E0F17':'#F4F5FB');}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function todayISO(){const d=new Date(), off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10)}
function fmtDate(iso){if(!iso)return '';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function fmtShort(iso){const d=new Date(iso+'T12:00:00');return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function asc(a){return [...a].sort((x,y)=>x.date.localeCompare(y.date))} function desc(a){return [...a].sort((x,y)=>y.date.localeCompare(x.date))}
function readJSON(k,fallback){try{const x=localStorage.getItem(k);return x?JSON.parse(x):fallback}catch(e){return fallback}}
function save(){try{localStorage.setItem(KEY_WORKOUT,JSON.stringify({exercises:state.exercises,logs:state.logs}));localStorage.setItem(KEY_BODYWEIGHT,JSON.stringify(state.bwLogs));localStorage.setItem(KEY_SETTINGS,JSON.stringify({unit:state.unit,theme:state.theme}))}catch(e){showToast('Browser storage is unavailable');}}
function load(){const wd=readJSON(KEY_WORKOUT,{exercises:[],logs:[]});const bw=readJSON(KEY_BODYWEIGHT,[]);const st=readJSON(KEY_SETTINGS,{unit:'kg',theme:'auto'});state.exercises=Array.isArray(wd.exercises)?wd.exercises:[];state.logs=Array.isArray(wd.logs)?wd.logs:[];state.bwLogs=Array.isArray(bw)?bw:[];state.unit=st.unit==='lb'?'lb':'kg';state.theme=['auto','light','dark'].includes(st.theme)?st.theme:'auto';state.selected=state.exercises[0]||'';}
function convert(v,from,to){if(from===to)return Number(v);return Math.round((from==='kg'?Number(v)*KG_TO_LB:Number(v)/KG_TO_LB)*10)/10}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.add('hidden'),1500)}
function seg(id,a,b,value,accent){return `<div class="seg" id="${id}"><button data-value="${a[0]}" class="${value===a[0]?'active '+accent:''}">${a[1]}</button><button data-value="${b[0]}" class="${value===b[0]?'active '+accent:''}">${b[1]}</button></div>`}
function empty(icon,title,sub){return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-title">${esc(title)}</div><div class="empty-sub">${esc(sub)}</div></div>`}
function screenHeading(type){return type==='progress'?`<section class="screen-heading"><div class="eyebrow"><span class="eyebrow-dot steel"></span>Momentum dashboard</div><h1 class="screen-title">Your effort,<br><em class="steel">in motion.</em></h1><p class="screen-sub">See every rep add up to something bigger.</p></section>`:`<section class="screen-heading"><div class="eyebrow"><span class="eyebrow-dot"></span>Today’s training</div><h1 class="screen-title">Make the work<br><em>count.</em></h1><p class="screen-sub">Show up, log it, and let consistency do the rest.</p></section>`}
function exerciseSuggestions(value){const q=value.trim().toLowerCase();return state.exercises.filter(x=>!q||x.toLowerCase().includes(q)).slice(0,8)}
function machineSuggestions(value,exerciseName){const q=value.trim().toLowerCase(),name=exerciseName.trim().toLowerCase();const values=[...new Set(state.logs.filter(x=>!name||String(x.exerciseName||'').toLowerCase()===name).map(x=>String(x.machineType||'').trim()).filter(Boolean))];return values.filter(x=>!q||x.toLowerCase().includes(q)).slice(0,8)}
function removeSuggestions(){document.querySelectorAll('.suggestions').forEach(x=>x.remove())}
function renderLog(){const mode=state.mode;return `${screenHeading('log')}${seg('logMode',['exercise','Exercise'],['bodyweight','Body Weight'],mode,mode==='bodyweight'?'steel':'red')}<div class="panel">${mode==='exercise'?renderExerciseLog():renderWeightLog()}</div>`}
function renderExerciseLog(){const recent=desc(state.logs).slice(0,5);return `<div class="stack"><div class="card stack"><div class="fields"><div class="field autocomplete"><label>Exercise</label><input id="exerciseName" class="input" type="text" placeholder="e.g. Bench Press" autocomplete="off"></div><div class="field autocomplete"><label>Machine / Type</label><input id="exerciseMachine" class="input" type="text" placeholder="e.g. Smith" autocomplete="off"></div><div class="field"><label>Date</label><input id="exerciseDate" class="input" type="date" value="${todayISO()}"></div><div class="field"><label>Weight (${state.unit})</label><input id="exerciseWeight" class="input" type="number" inputmode="decimal" step="0.5" placeholder="0"></div><div class="field"><label>Reps</label><input id="exerciseReps" class="input" type="number" inputmode="numeric" placeholder="0"></div><div class="field"><label>Sets</label><input id="exerciseSets" class="input" type="number" inputmode="numeric" placeholder="1"></div></div><input id="exerciseNotes" class="input" type="text" placeholder="Notes (optional)"><div id="lastExercise" class="callout red hidden"></div><div id="exerciseError" class="error hidden"></div><button id="saveExercise" class="btn red">Save entry</button></div>${recent.length?`<div><div class="section-title">Recent entries</div><div class="rows">${recent.map(renderExerciseRow).join('')}</div></div>`:''}</div>`}
function renderWeightLog(){const recent=desc(state.bwLogs).slice(0,5),last=recent[0];return `<div class="stack"><div class="card stack steel-card"><div class="fields"><div class="field"><label>Date</label><input id="bwDate" class="input" type="date" value="${todayISO()}"></div><div class="field"><label>Weight (${state.unit})</label><input id="bwWeight" class="input" type="number" inputmode="decimal" step="0.1" placeholder="0"></div></div>${last?`<div class="callout steel">Last logged (${fmtDate(last.date)}): <span class="mono">${esc(last.weight)}${state.unit}</span></div>`:''}<div id="bwError" class="error hidden"></div><button id="saveBw" class="btn steel">Save weight</button></div>${recent.length?`<div><div class="section-title">Recent entries</div><div class="rows">${recent.map(renderBwRow).join('')}</div></div>`:''}</div>`}
function renderExerciseRow(e){if(state.editing==='ex:'+e.id)return renderExerciseEdit(e);const context=esc(e.exerciseName)+(e.machineType?' · '+esc(e.machineType):'');return `<div class="row"><div class="row-main"><div class="row-kicker">${context}</div><div class="row-title"><span class="mono">${esc(e.weight)}${state.unit} × ${esc(e.reps)} × ${esc(e.sets)}</span></div><div class="row-sub">${fmtDate(e.date)}${e.notes?' · '+esc(e.notes):''}</div></div>${state.confirming==='ex:'+e.id?`<div class="row-actions"><button class="danger" data-delete-ex="${e.id}">Delete</button><button class="text-btn" data-cancel-confirm>Cancel</button></div>`:`<div class="row-actions"><button class="icon-btn" aria-label="Edit" data-edit-ex="${e.id}">✎</button><button class="icon-btn" aria-label="Delete" data-confirm-ex="${e.id}">⌫</button></div>`}</div>`}
function renderExerciseEdit(e){return `<div class="edit-row"><div class="row-title" style="font-weight:700;margin-bottom:8px">${esc(e.exerciseName)}</div><div class="field" style="margin-bottom:8px"><label>Machine / Type</label><input class="input" data-edit-field="machineType" type="text" value="${esc(e.machineType||'')}" placeholder="e.g. Smith"></div><div class="fields"><input class="input" data-edit-field="date" type="date" value="${esc(e.date)}"><input class="input" data-edit-field="weight" type="number" inputmode="decimal" value="${esc(e.weight)}"><input class="input" data-edit-field="reps" type="number" inputmode="numeric" value="${esc(e.reps)}"><input class="input" data-edit-field="sets" type="number" inputmode="numeric" value="${esc(e.sets)}"></div><input class="input" style="margin-top:8px" data-edit-field="notes" value="${esc(e.notes||'')}" placeholder="Notes (optional)"><div class="edit-actions"><button class="btn red" data-save-edit-ex="${e.id}">Save</button><button class="btn outline" data-cancel-edit>Cancel</button></div></div>`}
function renderBwRow(e){if(state.editing==='bw:'+e.id)return renderBwEdit(e);return `<div class="row steel-row"><div class="row-main"><div class="row-title mono">${esc(e.weight)}${state.unit}</div><div class="row-sub">${fmtDate(e.date)}</div></div>${state.confirming==='bw:'+e.id?`<div class="row-actions"><button class="danger" data-delete-bw="${e.id}">Delete</button><button class="text-btn" data-cancel-confirm>Cancel</button></div>`:`<div class="row-actions"><button class="icon-btn" aria-label="Edit" data-edit-bw="${e.id}">✎</button><button class="icon-btn" aria-label="Delete" data-confirm-bw="${e.id}">⌫</button></div>`}</div>`}
function renderBwEdit(e){return `<div class="edit-row"><div class="fields"><input class="input" data-edit-field="date" type="date" value="${esc(e.date)}"><input class="input" data-edit-field="weight" type="number" inputmode="decimal" value="${esc(e.weight)}"></div><div class="edit-actions"><button class="btn steel" data-save-edit-bw="${e.id}">Save</button><button class="btn outline" data-cancel-edit>Cancel</button></div></div>`}
function renderProgress(){const mode=state.progressMode;return `${screenHeading('progress')}${seg('progressMode',['exercise','Exercise'],['bodyweight','Body Weight'],mode,mode==='bodyweight'?'steel':'red')}<div class="panel">${mode==='exercise'?renderExerciseProgress():renderBwProgress()}</div>`}
function stats(items){return `<div class="stats">${items.map(x=>`<div class="stat ${x.tone||''}"><div class="stat-label">${esc(x.label)}</div><div class="stat-value">${esc(x.value)}${x.unit?`<span class="stat-unit">${esc(x.unit)}</span>`:''}</div></div>`).join('')}</div>`}
function renderExerciseProgress(){if(!state.exercises.length)return empty('▰','No exercises yet',"Log your first set from the Log tab and it'll show up here.");if(!state.exercises.includes(state.selected))state.selected=state.exercises[0];const entries=asc(state.logs.filter(x=>x.exerciseName===state.selected)).map(x=>({...x,volume:(+x.weight||0)*(+x.reps||0)*(+x.sets||0)}));const selector=`<div class="select-wrap"><select id="exerciseSelect" class="select">${state.exercises.map(x=>`<option ${x===state.selected?'selected':''}>${esc(x)}</option>`).join('')}</select><span class="select-arrow" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><path d="M5.5 7.5 10 12l4.5-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>`;if(!entries.length)return `${selector}<div style="height:12px"></div>${empty('↗','No entries for this exercise','Log a set to start tracking progress.')}<div class="delete-ex">${renderDeleteExercise()}</div>`;const best=Math.max(...entries.map(e=>+e.weight||0)),latest=+entries.at(-1).weight||0,change=latest-(+entries[0].weight||0);const content=state.view==='graph'?renderChartCard(entries,state.metric,'red'):`<div class="rows">${desc(entries).map(renderExerciseRow).join('')}</div>`;return `<div class="stack">${selector}${stats([{label:'Best',value:best,unit:state.unit,tone:'red'},{label:'Latest',value:latest,unit:state.unit},{label:'Change',value:(change>0?'+':'')+change.toFixed(1),unit:state.unit}])}${seg('viewMode',['graph','Graph'],['list','List'],state.view,'red')}${content}<div class="delete-ex">${renderDeleteExercise()}</div></div>`}
function renderDeleteExercise(){return state.confirmExercise?`<div class="confirm-ex"><span>Delete "${esc(state.selected)}" and all its entries?</span><button class="danger" id="deleteExercise">Delete</button><button class="text-btn" id="cancelDeleteExercise">Cancel</button></div>`:`<button class="text-btn" id="confirmDeleteExercise">Delete this exercise</button>`}
function renderBwProgress(){const entries=asc(state.bwLogs);if(!entries.length)return empty('⚖','No weigh-ins yet','Log your weight from the Log tab to start your trend.');const start=+entries[0].weight,current=+entries.at(-1).weight,change=current-start;const content=state.view==='graph'?renderChartCard(entries,'weight','steel'):`<div class="rows">${desc(entries).map(renderBwRow).join('')}</div>`;return `<div class="stack">${stats([{label:'Starting',value:start,unit:state.unit},{label:'Current',value:current,unit:state.unit,tone:'steel'},{label:'Change',value:(change>0?'+':'')+change.toFixed(1),unit:state.unit}])}${seg('viewMode',['graph','Graph'],['list','List'],state.view,'steel')}${content}</div>`}
function renderChartCard(entries,metric,tone){const isExercise='volume' in entries[0];return `<div class="card ${tone==='steel'?'steel-card':''}">${isExercise?`<div class="mini-seg"><div class="mini-seg-inner"><button data-metric="weight" class="${metric==='weight'?'active':''}">Weight</button><button data-metric="volume" class="${metric==='volume'?'active':''}">Volume</button></div></div>`:''}<div class="chart">${chartSVG(entries,metric,tone)}</div></div>`}
function chartSVG(entries,metric,tone){const W=500,H=220,L=42,R=10,T=12,B=30;const vals=entries.map(e=>metric==='volume'?+e.volume:+e.weight);let min=Math.min(...vals),max=Math.max(...vals);let pad=Math.max((max-min)*.2,metric==='volume'?5:1);min=Math.max(0,Math.floor(min-pad));max=Math.ceil(max+pad);if(max<=min)max=min+1;const x=i=>L+(entries.length===1?(W-L-R)/2:i*(W-L-R)/(entries.length-1));const y=v=>T+(max-v)*(H-T-B)/(max-min);let grid='',yl='';for(let i=0;i<4;i++){const yy=T+i*(H-T-B)/3,val=max-i*(max-min)/3;grid+=`<line class="chart-grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/>`;yl+=`<text class="chart-label" x="${L-5}" y="${yy+3}" text-anchor="end">${Math.round(val)}</text>`}const pts=entries.map((e,i)=>`${x(i)},${y(vals[i])}`).join(' ');const color=tone==='steel'?'var(--steel)':'var(--red)';const dots=entries.map((e,i)=>`<circle cx="${x(i)}" cy="${y(vals[i])}" r="4" fill="${color}"><title>${fmtDate(e.date)}: ${metric==='volume'?Math.round(vals[i]):vals[i]}${metric==='volume'?'':state.unit}</title></circle>`).join('');let xl='';const picks=[0,Math.floor((entries.length-1)/2),entries.length-1].filter((v,i,a)=>a.indexOf(v)===i);for(const i of picks)xl+=`<text class="chart-label" x="${x(i)}" y="${H-7}" text-anchor="middle">${esc(fmtShort(entries[i].date))}</text>`;return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Progress chart">${grid}${yl}<polyline fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>${dots}${xl}</svg>`}
function render(){main.innerHTML=state.tab==='log'?renderLog():renderProgress();$('#unitBtn').textContent=state.unit.toUpperCase();$('#themeSelect').value=state.theme;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));if(state.tab==='log'&&state.mode==='exercise')bindExerciseLive();}
function bindExerciseLive(){const input=$('#exerciseName'),machine=$('#exerciseMachine');if(!input||!machine)return;const updateLast=()=>{const matched=state.exercises.find(e=>e.toLowerCase()===input.value.trim().toLowerCase());const machineValue=machine.value.trim().toLowerCase();let matches=matched?state.logs.filter(l=>l.exerciseName===matched):[];if(machineValue){const sameType=matches.filter(l=>String(l.machineType||'').trim().toLowerCase()===machineValue);if(sameType.length)matches=sameType}const last=matches.length?desc(matches)[0]:null,box=$('#lastExercise');if(last){const type=last.machineType?` · ${esc(last.machineType)}`:'';box.innerHTML=`Last time${type} (${fmtDate(last.date)}): <span class="mono">${esc(last.weight)}${state.unit} × ${esc(last.reps)} × ${esc(last.sets)}</span>`;box.classList.remove('hidden')}else box.classList.add('hidden')};const showExerciseSuggestions=()=>{removeSuggestions();updateLast();const s=exerciseSuggestions(input.value);if(s.length&&document.activeElement===input){const d=document.createElement('div');d.className='suggestions';d.innerHTML=s.map(x=>`<button type="button" data-suggestion="${esc(x)}">${esc(x)}</button>`).join('');input.parentElement.appendChild(d)}};const showMachineSuggestions=()=>{removeSuggestions();updateLast();const s=machineSuggestions(machine.value,input.value);if(s.length&&document.activeElement===machine){const d=document.createElement('div');d.className='suggestions';d.innerHTML=s.map(x=>`<button type="button" data-machine-suggestion="${esc(x)}">${esc(x)}</button>`).join('');machine.parentElement.appendChild(d)}};input.addEventListener('input',showExerciseSuggestions);input.addEventListener('focus',showExerciseSuggestions);machine.addEventListener('input',showMachineSuggestions);machine.addEventListener('focus',showMachineSuggestions);}
function saveExercise(){const name=$('#exerciseName').value.trim(),machineType=$('#exerciseMachine').value.trim(),date=$('#exerciseDate').value,weight=Number($('#exerciseWeight').value)||0,reps=Number($('#exerciseReps').value),sets=Number($('#exerciseSets').value)||1,notes=$('#exerciseNotes').value.trim(),err=$('#exerciseError');if(!name){err.textContent='Enter an exercise name';err.classList.remove('hidden');return}if(!reps||reps<=0){err.textContent='Enter reps';err.classList.remove('hidden');return}const existing=state.exercises.find(e=>e.toLowerCase()===name.toLowerCase());const canonical=existing||name;if(!existing)state.exercises.push(canonical);state.logs.push({id:uid(),exerciseName:canonical,machineType,date,weight,reps,sets,notes});state.selected=canonical;save();render();showToast('Entry saved')}
function saveBw(){const weight=Number($('#bwWeight').value),date=$('#bwDate').value,err=$('#bwError');if(!weight||weight<=0){err.textContent='Enter your weight';err.classList.remove('hidden');return}state.bwLogs.push({id:uid(),date,weight});save();render();showToast('Weight saved')}
function updateEdit(kind,id,el){const item=kind==='ex'?state.logs.find(x=>x.id===id):state.bwLogs.find(x=>x.id===id);if(!item)return;const wrap=el.closest('.edit-row');wrap.querySelectorAll('[data-edit-field]').forEach(i=>{const k=i.dataset.editField;item[k]=(k==='weight'||k==='reps'||k==='sets')?Number(i.value):i.value});save();state.editing=null;render();showToast('Updated')}
main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.closest('#logMode')){state.mode=b.dataset.value;state.editing=state.confirming=null;render();return}if(b.closest('#progressMode')){state.progressMode=b.dataset.value;state.editing=state.confirming=null;render();return}if(b.closest('#viewMode')){state.view=b.dataset.value;state.editing=state.confirming=null;render();return}if(b.dataset.metric){state.metric=b.dataset.metric;render();return}if(b.id==='saveExercise'){saveExercise();return}if(b.id==='saveBw'){saveBw();return}if(b.dataset.suggestion){$('#exerciseName').value=b.dataset.suggestion;removeSuggestions();$('#exerciseName').dispatchEvent(new Event('input'));return}if(b.dataset.machineSuggestion){$('#exerciseMachine').value=b.dataset.machineSuggestion;removeSuggestions();$('#exerciseMachine').dispatchEvent(new Event('input'));return}if(b.dataset.editEx){state.editing='ex:'+b.dataset.editEx;state.confirming=null;render();return}if(b.dataset.editBw){state.editing='bw:'+b.dataset.editBw;state.confirming=null;render();return}if(b.dataset.confirmEx){state.confirming='ex:'+b.dataset.confirmEx;render();return}if(b.dataset.confirmBw){state.confirming='bw:'+b.dataset.confirmBw;render();return}if(b.hasAttribute('data-cancel-confirm')){state.confirming=null;render();return}if(b.dataset.deleteEx){state.logs=state.logs.filter(x=>x.id!==b.dataset.deleteEx);state.confirming=null;save();render();return}if(b.dataset.deleteBw){state.bwLogs=state.bwLogs.filter(x=>x.id!==b.dataset.deleteBw);state.confirming=null;save();render();return}if(b.dataset.saveEditEx){updateEdit('ex',b.dataset.saveEditEx,b);return}if(b.dataset.saveEditBw){updateEdit('bw',b.dataset.saveEditBw,b);return}if(b.hasAttribute('data-cancel-edit')){state.editing=null;render();return}if(b.id==='confirmDeleteExercise'){state.confirmExercise=true;render();return}if(b.id==='cancelDeleteExercise'){state.confirmExercise=false;render();return}if(b.id==='deleteExercise'){const name=state.selected;state.exercises=state.exercises.filter(x=>x!==name);state.logs=state.logs.filter(x=>x.exerciseName!==name);state.selected=state.exercises[0]||'';state.confirmExercise=false;save();render();return}});
main.addEventListener('change',e=>{if(e.target.id==='exerciseSelect'){state.selected=e.target.value;state.confirmExercise=false;render()}});
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;state.tab=b.dataset.tab;state.editing=state.confirming=null;render();window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
$('#unitBtn').addEventListener('click',()=>{const next=state.unit==='kg'?'lb':'kg',from=state.unit;state.logs=state.logs.map(x=>({...x,weight:convert(x.weight,from,next)}));state.bwLogs=state.bwLogs.map(x=>({...x,weight:convert(x.weight,from,next)}));state.unit=next;save();render()});
$('#themeSelect').addEventListener('change',e=>{state.theme=e.target.value;applyTheme();save();showToast(state.theme==='auto'?'Theme follows device':state.theme[0].toUpperCase()+state.theme.slice(1)+' theme')});
const handleDeviceTheme=()=>{if(state.theme==='auto')applyTheme()};if(themeQuery.addEventListener)themeQuery.addEventListener('change',handleDeviceTheme);else themeQuery.addListener(handleDeviceTheme);
document.addEventListener('click',e=>{if(!e.target.closest('.autocomplete'))removeSuggestions()});
load();applyTheme();render();
})();
</script>
</body>
</html>
